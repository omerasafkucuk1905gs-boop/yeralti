<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>YERALTI - Derinlere Kaz</title>
  <meta name="description" content="YERALTI: derinlere kaz, cevher bul, boyutlara git, bossları yen! Tarayıcıda ücretsiz oynanan kazı oyunu. Yeni: YERALTI 3B.">
  <meta name="keywords" content="yeraltı, yeralti, derinlere kaz, kazı oyunu, maden oyunu, tarayıcı oyunu, ücretsiz oyun">
  <style>
    html, body { margin: 0; height: 100%; background: #111; display: grid; place-items: center; overflow: hidden; }
    canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
      display: block;
      touch-action: none;          /* telefonda dokunuşlar sayfayı kaydırmasın, oyuna gitsin */
      -webkit-user-select: none; user-select: none;
    }
    html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="sinema/liste.js"></script>
  <script src="oyun.js"></script>
</body>
</html>
